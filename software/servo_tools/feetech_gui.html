<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-Arm — Dual Pose Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ground:  #141210;
  --surface: #1D1B18;
  --surface2:#232019;
  --text:    #C4B89A;
  --dim:     #534D44;
  --dim2:    #252220;
  --accent:  #D4841A;
  --ok:      #3E7A5C;
  --err:     #8B3A2A;
  --border:  #2C2924;
  --mono:    'SF Mono',Menlo,Monaco,'Courier New',monospace;
  --sans:    system-ui,-apple-system,sans-serif;
}

html,body{
  height:100%;overflow:hidden;
  background:var(--ground);color:var(--text);
  font-family:var(--sans);font-size:13px;
  -webkit-font-smoothing:antialiased;
}

.app{display:flex;flex-direction:column;height:100vh}

/* ── Header ──────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:14px;
  padding:0 18px;height:42px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.logo{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.logo b{color:var(--accent);font-weight:600;letter-spacing:.06em}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
.dot.ok{background:var(--ok);box-shadow:0 0 5px rgba(62,122,92,.6)}
.dot.scan{background:var(--accent);animation:blip 1.4s ease-in-out infinite}
.dot.err{background:var(--err)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.3}}
.hkey{
  margin-left:auto;
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase;
  padding:2px 6px;border:1px solid var(--border);border-radius:2px;
  flex-shrink:0;
}
.zero-badge{
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  color:var(--ok);text-transform:uppercase;
  padding:2px 6px;border:1px solid var(--ok);border-radius:2px;
  opacity:.85;flex-shrink:0;display:none;
}
.game-label{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.game-score-val{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.game-arm-val{font-family:var(--mono);font-size:9px;color:#4AFFC8;letter-spacing:.12em;text-transform:uppercase}

/* ── Body: two arm panels ────────────────────────────── */
.body{display:flex;flex-direction:row;flex:1;overflow:hidden;min-height:0}

.arm-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;
}
.arm-panel+.arm-panel{border-left:1px solid var(--border)}

/* ── Arm label strip ─────────────────────────────────── */
.arm-tag{
  flex-shrink:0;height:22px;
  display:flex;align-items:center;gap:8px;
  padding:0 14px;
  background:var(--surface2);border-bottom:1px solid var(--border);
}
.arm-tag-name{
  font-family:var(--mono);font-size:8px;letter-spacing:.28em;
  color:var(--accent);text-transform:uppercase;font-weight:600;
}
.arm-tag-port{
  font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.04em;
}

/* ── FK views ────────────────────────────────────────── */
.views{
  display:flex;flex:1;overflow:hidden;min-height:0;
  background:var(--ground);
}
.view-pane{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:8px 4px 6px;gap:4px;overflow:hidden;
  min-width:0;
}
.view-pane+.view-pane{border-left:1px solid var(--border)}
.view-3d{flex:2}
.view-label{
  font-family:var(--mono);font-size:8px;letter-spacing:.22em;
  color:var(--dim);text-transform:uppercase;
  align-self:flex-start;padding-left:4px;flex-shrink:0;
}
.view-pane canvas{display:block;max-width:100%;max-height:100%}

#pane-3d-left,#pane-3d-right{
  flex:1;align-self:stretch;min-height:0;overflow:hidden;position:relative;
}
#pane-3d-left canvas,#pane-3d-right canvas{
  display:block;max-width:none!important;max-height:none!important;
}
.no-three{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--dim);text-transform:uppercase;
}

/* ── Joint bars ──────────────────────────────────────── */
.bars{
  flex-shrink:0;
  padding:5px 14px 7px;
  display:flex;flex-direction:column;gap:1px;
  background:var(--surface);
  border-top:1px solid var(--border);
}
.bar-row{display:flex;align-items:center;gap:8px;height:24px}
.bar-row.miss .bar-name{color:var(--err)}
.bar-row.miss .bar-fill{background:var(--err)!important}
.bar-row.miss .bar-deg{color:var(--err)}
.bar-name{
  font-family:var(--mono);font-size:8px;letter-spacing:.12em;
  color:var(--dim);text-transform:uppercase;
  width:96px;flex-shrink:0;white-space:nowrap;overflow:hidden;
}
.bar-track{flex:1;height:4px;background:var(--dim2);border-radius:2px;position:relative;min-width:40px}
.bar-fill{position:absolute;height:100%;background:var(--accent);border-radius:2px}
.bar-zero{
  position:absolute;top:-3px;left:calc(50% - .5px);
  width:1px;height:calc(100% + 6px);background:var(--dim);opacity:.6;
}
.bar-deg{font-family:var(--mono);font-size:10px;color:var(--accent);width:56px;text-align:right;flex-shrink:0;letter-spacing:.02em}
.bar-pos{font-family:var(--mono);font-size:8px;color:var(--dim);width:34px;text-align:right;flex-shrink:0}

/* ── Footer ──────────────────────────────────────────── */
footer{
  height:24px;flex-shrink:0;padding:0 18px;
  display:flex;align-items:center;
  background:var(--surface);border-top:1px solid var(--border);
  font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo"><b>U-Arm</b>&thinsp; pose monitor</div>
  <div class="sep"></div>
  <div class="badge">
    <div class="dot scan" id="dot-left"></div>
    <span id="status-left">left · connecting…</span>
  </div>
  <div class="sep"></div>
  <div class="badge">
    <div class="dot scan" id="dot-right"></div>
    <span id="status-right">right · connecting…</span>
  </div>
  <span class="zero-badge" id="zero-badge">zeroed</span>
  <div class="hkey">[H] zero both</div>
  <div class="sep"></div>
  <div class="badge"><span class="game-label">arm&thinsp;</span><span id="game-arm" class="game-arm-val">—</span></div>
  <div class="sep"></div>
  <div class="badge"><span class="game-label">score&thinsp;</span><span id="game-score" class="game-score-val">0</span></div>
</header>

<div class="body">

  <!-- LEFT ARM -->
  <div class="arm-panel" id="panel-left">
    <div class="arm-tag">
      <span class="arm-tag-name">left</span>
      <span class="arm-tag-port">/dev/cu.usbmodemXXXX</span>
    </div>
    <div class="views">
      <!-- <div class="view-pane">
        <span class="view-label">side</span>
        <canvas id="cv-side-left"></canvas>
      </div> -->
      <div class="view-pane view-3d">
        <span class="view-label">3d</span>
        <div id="pane-3d-left"></div>
      </div>
      <!-- <div class="view-pane">
        <span class="view-label">top</span>
        <canvas id="cv-top-left"></canvas>
      </div> -->
    </div>
    <div class="bars" id="bars-left"></div>
  </div>

  <!-- RIGHT ARM -->
  <div class="arm-panel" id="panel-right">
    <div class="arm-tag">
      <span class="arm-tag-name">right</span>
      <span class="arm-tag-port">/dev/cu.usbmodemYYYY</span>
    </div>
    <div class="views">
      <!-- <div class="view-pane">
        <span class="view-label">side</span>
        <canvas id="cv-side-right"></canvas>
      </div> -->
      <div class="view-pane view-3d">
        <span class="view-label">3d</span>
        <div id="pane-3d-right"></div>
      </div>
      <!-- <div class="view-pane">
        <span class="view-label">top</span>
        <canvas id="cv-top-right"></canvas>
      </div> -->
    </div>
    <div class="bars" id="bars-right"></div>
  </div>

</div><!-- .body -->

<footer id="log">— waiting for connection —</footer>

</div><!-- .app -->
<script src="feetech_game.js"></script>
<script>
// ── Shared constants ──────────────────────────────────────
const JOINTS = [
  {id:0, name:'shoulder_pan'},
  {id:1, name:'shoulder_lift'},
  {id:2, name:'elbow_flex'},
  {id:3, name:'wrist_flex'},
  {id:4, name:'wrist_roll'},
  {id:5, name:'hand'},
  {id:6, name:'gripper'},
];
const LIMIT_DEG = 90.0;

const L = [83, 77, 26, 17];
const FORE_RISE = 13, FORE_HORIZ = 76;

const PI = Math.PI, TAU = PI*2, D2R = PI/180;
const DPR = window.devicePixelRatio || 1;

const SIDE_W = 220, SIDE_H = 240;
const SIDE_CX = SIDE_W/2, SIDE_BASE = SIDE_H - 26;
const TOP_W = 210, TOP_H = 210;
const TOP_CX = TOP_W/2, TOP_CY = TOP_H/2;

const TRAIL_LEN = 18;
const REST_POSE_DEG  = [0, -90, 170, -25, 0, 0, 0];
// [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, hand, gripper]
const FK_SIGN = {
  left:  [1, -1, 1, 1,  1, 1, 1],  // all reversed except wrist_roll
  right: [-1, -1,  1,  1,  1,  1,  1],
};
const DEFAULT_HOME   = [2170, 2047, 2785, 1075, 2085, 1601, 1681];

// ── Canvas init ───────────────────────────────────────────
function initCanvas(id, lw, lh) {
  const c = document.getElementById(id);
  c.width  = lw * DPR; c.height = lh * DPR;
  c.style.width = lw+'px'; c.style.height = lh+'px';
  const ctx = c.getContext('2d');
  ctx.scale(DPR, DPR);
  return ctx;
}

// ── FK math ───────────────────────────────────────────────
function elevAngles(degs) {
  const a1 = degs[1]*D2R, a2 = a1+degs[2]*D2R, a3 = a2+degs[3]*D2R;
  return [a1, a2, a3];
}
function sidePoints(degs) {
  const [a1,,a3] = elevAngles(degs);
  let px=SIDE_CX, py=SIDE_BASE;
  const pts=[{x:px,y:py}];
  px+=L[0]*Math.sin(a1); py-=L[0]*Math.cos(a1); pts.push({x:px,y:py});
  px+=FORE_HORIZ; py-=FORE_RISE; pts.push({x:px,y:py});
  px+=L[2]*Math.sin(a3); py-=L[2]*Math.cos(a3); pts.push({x:px,y:py});
  px+=L[3]*Math.sin(a3); py-=L[3]*Math.cos(a3); pts.push({x:px,y:py});
  return pts;
}
function topPoints(degs) {
  const φ=degs[0]*D2R, [a1,a2,a3]=elevAngles(degs), angs=[a1,a2,a3,a3];
  let px=TOP_CX, py=TOP_CY;
  const pts=[{x:px,y:py}];
  angs.forEach((α,k)=>{ const h=L[k]*Math.sin(α); px+=h*Math.sin(φ); py-=h*Math.cos(φ); pts.push({x:px,y:py}); });
  return pts;
}

// ── Autofit ───────────────────────────────────────────────
function autofit(pts, cW, cH, pad) {
  pad=pad||14;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const bw=Math.max(maxX-minX,1), bh=Math.max(maxY-minY,1);
  const scale=Math.min((cW-2*pad)/bw, (cH-2*pad)/bh, 2.0);
  return {scale, tx:cW/2-(minX+bw/2)*scale, ty:cH/2-(minY+bh/2)*scale};
}

// ── Drawing helpers ───────────────────────────────────────
function drawChain(ctx,pts,oW,iW,oC,iC){
  for(let k=0;k<pts.length-1;k++){ctx.beginPath();ctx.moveTo(pts[k].x,pts[k].y);ctx.lineTo(pts[k+1].x,pts[k+1].y);ctx.strokeStyle=oC;ctx.lineWidth=oW;ctx.lineCap='round';ctx.stroke();}
  for(let k=0;k<pts.length-1;k++){ctx.beginPath();ctx.moveTo(pts[k].x,pts[k].y);ctx.lineTo(pts[k+1].x,pts[k+1].y);ctx.strokeStyle=iC;ctx.lineWidth=iW;ctx.stroke();}
}
function drawJoints(ctx,pts){
  pts.forEach((p,k)=>{
    if(k===0)return;
    const isEE=k===pts.length-1;
    ctx.beginPath();ctx.arc(p.x,p.y,isEE?5:3.5,0,TAU);ctx.fillStyle='#1D1B18';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,isEE?3:2,0,TAU);ctx.fillStyle=isEE?'#FFD06A':'#D4841A';ctx.fill();
  });
}

// ── Side draw ─────────────────────────────────────────────
function drawSide(ctx, degs, trailPoses) {
  ctx.clearRect(0,0,SIDE_W,SIDE_H);
  const pts=sidePoints(degs);
  const [,,a3]=elevAngles(degs);
  const gripRad=degs[6]*D2R, rollRad=degs[4]*D2R;
  const gripSpread=Math.abs(gripRad)/(PI/2)*18, jawLen=13;
  const pxN=Math.cos(a3+PI/2), pyN=Math.sin(a3+PI/2);
  const fxN=Math.cos(a3), fyN=Math.sin(a3);
  const ee=pts[pts.length-1];
  const bbPts=[...pts,{x:SIDE_CX-30,y:SIDE_BASE+10},{x:SIDE_CX+30,y:SIDE_BASE+10},
    {x:ee.x+pxN*(gripSpread+jawLen),y:ee.y+pyN*(gripSpread+jawLen)},
    {x:ee.x-pxN*(gripSpread+jawLen),y:ee.y-pyN*(gripSpread+jawLen)}];
  const {scale,tx,ty}=autofit(bbPts,SIDE_W,SIDE_H,14);
  ctx.save(); ctx.translate(tx,ty); ctx.scale(scale,scale);
  trailPoses.slice(0,-1).forEach((td,ti)=>{
    const alpha=Math.pow(ti/trailPoses.length,1.5)*0.22;
    const tpts=sidePoints(td);
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.moveTo(tpts[0].x,tpts[0].y);tpts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.strokeStyle='#D4841A';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    ctx.restore();
  });
  const oW=[10,9,7,6], iW=[4,3.5,2.5,2.5];
  function drawSeg(k,col,lw){
    ctx.beginPath();
    if(k===1){ctx.moveTo(pts[1].x,pts[1].y);ctx.lineTo(pts[1].x,pts[2].y);ctx.lineTo(pts[2].x,pts[2].y);}
    else{ctx.moveTo(pts[k].x,pts[k].y);ctx.lineTo(pts[k+1].x,pts[k+1].y);}
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }
  for(let k=0;k<pts.length-1;k++)drawSeg(k,'#332F2A',oW[k]);
  for(let k=0;k<pts.length-1;k++)drawSeg(k,'#5A5448',iW[k]);
  drawJoints(ctx,pts);
  [-1,1].forEach(side=>{
    const sx=ee.x+pxN*gripSpread*side, sy=ee.y+pyN*gripSpread*side;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+fxN*jawLen,sy+fyN*jawLen);
    ctx.strokeStyle='#7A6A50';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();
  });
  const wj=pts[3];
  ctx.beginPath();ctx.arc(wj.x,wj.y,5,0,TAU);ctx.strokeStyle='#2A2722';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(wj.x,wj.y);
  ctx.lineTo(wj.x+Math.cos(a3+rollRad)*5,wj.y+Math.sin(a3+rollRad)*5);
  ctx.strokeStyle='#D4841A';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.moveTo(SIDE_CX-26,SIDE_BASE+8);ctx.lineTo(SIDE_CX+26,SIDE_BASE+8);
  ctx.strokeStyle='#3A3530';ctx.lineWidth=4;ctx.lineCap='butt';ctx.stroke();
}

// ── Top draw ──────────────────────────────────────────────
function drawTop(ctx, degs, trailPoses) {
  ctx.clearRect(0,0,TOP_W,TOP_H);
  const pts=topPoints(degs);
  const φ=degs[0]*D2R;
  const bbPts=[...pts,{x:TOP_CX-24,y:TOP_CY-24},{x:TOP_CX+24,y:TOP_CY+24}];
  const {scale,tx,ty}=autofit(bbPts,TOP_W,TOP_H,16);
  ctx.save();ctx.translate(tx,ty);ctx.scale(scale,scale);
  const maxReach=L.reduce((a,b)=>a+b,0);
  ctx.beginPath();ctx.arc(TOP_CX,TOP_CY,maxReach,0,TAU);
  ctx.strokeStyle='#232020';ctx.lineWidth=1;ctx.setLineDash([3,7]);ctx.stroke();ctx.setLineDash([]);
  [[TOP_CX-12,TOP_CY,TOP_CX-5,TOP_CY],[TOP_CX+5,TOP_CY,TOP_CX+12,TOP_CY],
   [TOP_CX,TOP_CY-12,TOP_CX,TOP_CY-5],[TOP_CX,TOP_CY+5,TOP_CX,TOP_CY+12]]
  .forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle='#2A2722';ctx.lineWidth=1;ctx.stroke();});
  trailPoses.slice(0,-1).forEach((td,ti)=>{
    const alpha=Math.pow(ti/trailPoses.length,1.5)*0.22;
    const tpts=topPoints(td);
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.moveTo(tpts[0].x,tpts[0].y);tpts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.strokeStyle='#D4841A';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    ctx.restore();
  });
  const panR=20;
  ctx.beginPath();ctx.arc(TOP_CX,TOP_CY,panR,-PI/2-0.9,-PI/2+0.9);
  ctx.strokeStyle='#252220';ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();
  if(Math.abs(φ)>0.015){
    ctx.beginPath();ctx.arc(TOP_CX,TOP_CY,panR,-PI/2,-PI/2+φ,φ<0);
    ctx.strokeStyle='#D4841A';ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();
  }
  drawChain(ctx,pts,9,3.5,'#332F2A','#5A5448');
  drawJoints(ctx,pts);
  const eeT=pts[pts.length-1];
  ctx.beginPath();ctx.moveTo(eeT.x-4,eeT.y);ctx.lineTo(eeT.x+4,eeT.y);
  ctx.moveTo(eeT.x,eeT.y-4);ctx.lineTo(eeT.x,eeT.y+4);
  ctx.strokeStyle='#FFD06A';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
}

// ── Three.js per-arm 3D ───────────────────────────────────
function init3D(containerId) {
  const container=document.getElementById(containerId);
  if(typeof THREE==='undefined'){
    container.innerHTML='<div class="no-three">3d · requires internet</div>';
    return {update3D:function(_d){}, getEEPosition:function(){return {distanceTo:function(){return Infinity;}};}, scene:null};
  }
  const W=container.clientWidth||340, H=container.clientHeight||280;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x141210);
  renderer.setSize(W,H);
  container.appendChild(renderer.domElement);
  const camera=new THREE.PerspectiveCamera(40,W/H,0.01,10);
  camera.position.set(0,0.65,-0.82);
  camera.lookAt(0,0.05,0.10);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x141210);
  const grid=new THREE.GridHelper(2.0,20,0x6A6050,0x38322A);
  grid.position.y=-0.001;
  scene.add(grid);
  scene.add(new THREE.AmbientLight(0x4A3020,1.0));
  const sun=new THREE.DirectionalLight(0xFFCC77,1.5);
  sun.position.set(0.6,1.2,0.8);scene.add(sun);
  const fill=new THREE.DirectionalLight(0x203040,0.35);
  fill.position.set(-1,0.4,-0.5);scene.add(fill);
  const rim=new THREE.DirectionalLight(0x4060A0,0.45);
  rim.position.set(-0.6,0.3,-0.9);scene.add(rim);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.target.set(0,0.05,0.10);controls.enableDamping=true;
  controls.dampingFactor=0.08;controls.minDistance=0.30;controls.maxDistance=2.0;controls.update();
  function mkMat(color){return new THREE.MeshPhongMaterial({color,flatShading:true,shininess:22});}
  function mkServoBox(color){
    const grp=new THREE.Object3D();
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.028,0.023,0.016),mkMat(color));
    body.position.y=0.0115;grp.add(body);
    const horn=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.005,8),mkMat(0xD4841A));
    horn.position.y=0.025;grp.add(horn);
    return grp;
  }
  function mkBracket(length,color){
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.012,length,0.005),mkMat(color));
    m.position.y=length/2;return m;
  }
  const LL=[0.165,0.153,0.052,0.033];
  const basePlate=new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,0.010,12),mkMat(0x3A3530));
  basePlate.position.y=0.005;scene.add(basePlate);
  const basePanServo=mkServoBox(0x252220);basePanServo.position.y=0.010;scene.add(basePanServo);
  const panG=new THREE.Object3D();panG.position.y=0.033;scene.add(panG);
  const liftG=new THREE.Object3D();panG.add(liftG);
  liftG.add(mkServoBox(0x252220));liftG.add(mkBracket(LL[0],0x4A4540));
  const elbowG=new THREE.Object3D();elbowG.position.y=LL[0];liftG.add(elbowG);
  elbowG.add(mkServoBox(0x252220));
  const ELBOW_RISER=0.010;
  const elbowRiser=new THREE.Mesh(new THREE.BoxGeometry(0.012,0.005,ELBOW_RISER),mkMat(0x4A4540));
  elbowRiser.position.set(0,0,-ELBOW_RISER/2);elbowG.add(elbowRiser);
  const elbowHoriz=new THREE.Mesh(new THREE.BoxGeometry(0.012,LL[1],0.005),mkMat(0x4A4540));
  elbowHoriz.position.set(0,LL[1]/2,-ELBOW_RISER);elbowG.add(elbowHoriz);
  const wristFG=new THREE.Object3D();wristFG.position.y=LL[1];elbowG.add(wristFG);
  wristFG.add(mkServoBox(0x252220));wristFG.add(mkBracket(LL[2],0x4A4540));
  const wristRG=new THREE.Object3D();wristRG.position.y=LL[2];wristFG.add(wristRG);
  wristRG.add(mkServoBox(0x252220));wristRG.add(mkBracket(LL[3],0x4A4540));
  const eeG=new THREE.Object3D();eeG.position.y=LL[3];wristRG.add(eeG);
  eeG.add(new THREE.Mesh(new THREE.SphereGeometry(0.014,8,6),mkMat(0xFFD06A)));
  const jawMat=mkMat(0x524E48),jawGeo=new THREE.BoxGeometry(0.010,0.032,0.012);
  const jaw1=new THREE.Mesh(jawGeo,jawMat),jaw2=new THREE.Mesh(jawGeo,jawMat);
  jaw1.position.set(0.020,0.016,0);jaw2.position.set(-0.020,0.016,0);
  eeG.add(jaw1);eeG.add(jaw2);
  new ResizeObserver(()=>{
    const w=container.clientWidth,h=container.clientHeight;
    if(w>0&&h>0){camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
  }).observe(container);
  (function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera);})();
  function update3D(d){
    panG.rotation.y   = d[0]*D2R;
    liftG.rotation.x  = d[1]*D2R;
    elbowG.rotation.x = d[2]*D2R;
    wristFG.rotation.x= d[3]*D2R;
    wristFG.updateWorldMatrix(true,false);
    const _Qp=new THREE.Quaternion();wristFG.getWorldQuaternion(_Qp);
    const _Ry=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),d[4]*D2R);
    wristRG.quaternion.copy(_Qp.clone().invert().multiply(_Ry).multiply(_Qp));
    eeG.rotation.y=-d[5]*D2R;
    const spread=0.005+Math.abs(d[6])/90*0.035;
    jaw1.position.x=spread;jaw2.position.x=-spread;
  }
  function getEEPosition(){
    const v=new THREE.Vector3();
    eeG.getWorldPosition(v);
    return v;
  }
  return {update3D, getEEPosition, scene};
}

// ── Arm controller factory ────────────────────────────────
function createArm(arm) {
  // const sideCtx = initCanvas(`cv-side-${arm}`, SIDE_W, SIDE_H);
  // const topCtx  = initCanvas(`cv-top-${arm}`,  TOP_W,  TOP_H);
  const arm3D   = init3D(`pane-3d-${arm}`);
  const update3D = arm3D.update3D;

  // Per-arm state
  let homePos    = [...DEFAULT_HOME];
  let lastRawPos = [...DEFAULT_HOME];
  let trail      = [];
  let autoHomed  = false;

  // Build bar rows
  const barsEl = document.getElementById(`bars-${arm}`);
  JOINTS.forEach(j => {
    const row = document.createElement('div');
    row.className='bar-row'; row.id=`row-${arm}-${j.id}`;
    row.innerHTML=
      `<span class="bar-name">${j.name}</span>`+
      `<div class="bar-track">`+
        `<div class="bar-fill" id="bf-${arm}-${j.id}" style="left:50%;width:0"></div>`+
        `<div class="bar-zero"></div>`+
      `</div>`+
      `<span class="bar-deg" id="bd-${arm}-${j.id}">—</span>`+
      `<span class="bar-pos" id="bp-${arm}-${j.id}">—</span>`;
    barsEl.appendChild(row);
  });

  // Draw rest pose immediately
  // drawSide(sideCtx, REST_POSE_DEG, []);
  // drawTop(topCtx,   REST_POSE_DEG, []);
  update3D(REST_POSE_DEG);

  function zero() {
    homePos = [...lastRawPos];
    document.getElementById('log').textContent =
      `[${arm}] home set · delta from this encoder position`;
  }

  function update(armData) {
    const servos = armData.servos || {};
    const status = armData.status || 'unknown';

    // Status dot
    const dot  = document.getElementById(`dot-${arm}`);
    const stEl = document.getElementById(`status-${arm}`);
    if(status==='ok'){
      dot.className='dot ok'; stEl.textContent=`${arm} · connected`;
    } else if(status==='scanning…'||status==='starting'){
      dot.className='dot scan'; stEl.textContent=`${arm} · ${status}`;
    } else {
      dot.className='dot err'; stEl.textContent=`${arm} · ${status}`;
    }

    // Track raw positions for H key
    JOINTS.forEach((j,i) => {
      const s=servos[String(j.id)];
      if(s && s.ok) lastRawPos[i]=s.pos;
    });

    // Auto-home on first valid frame
    if(!autoHomed && JOINTS.some(j => { const s=servos[String(j.id)]; return s&&s.ok; })) {
      homePos = [...lastRawPos];
      autoHomed = true;
    }

    // Compute display degrees from home, normalized to [-180, 180].
    // Normalizing avoids -300° vs +60° wrap-around when one arm's servo
    // home sits near the encoder maximum.
    const displayDegs = JOINTS.map((j,i) => {
      const s=servos[String(j.id)];
      if(!(s && s.ok)) return 0;
      let deg = (s.pos - homePos[i]) / 4095 * 360;
      deg = deg % 360;
      if(deg > 180)  deg -= 360;
      if(deg < -180) deg += 360;
      return deg;
    });

    const fkDegs = displayDegs.map((d,i) => FK_SIGN[arm][i]*d + REST_POSE_DEG[i]);

    const anyOk = JOINTS.some(j => { const s=servos[String(j.id)]; return s&&s.ok; });
    if(anyOk){
      trail.push([...fkDegs]);
      if(trail.length>TRAIL_LEN) trail.shift();
    }

    // if(trail.length>0){
    //   drawSide(sideCtx, fkDegs, trail);
    //   drawTop(topCtx,   fkDegs, trail);
    // }
    update3D(fkDegs);
    if(typeof game!=='undefined' && game.scenes[arm]) game.onEEUpdate(arm, arm3D.getEEPosition());

    // Bars
    JOINTS.forEach((j,i) => {
      const s  = servos[String(j.id)];
      const ok = s && s.ok;
      const deg = displayDegs[i];
      const pos = ok ? s.pos : 0;
      const row = document.getElementById(`row-${arm}-${j.id}`);
      row.className='bar-row'+(ok?'':' miss');
      const frac=Math.max(-1,Math.min(1,deg/LIMIT_DEG))*50;
      const bf=document.getElementById(`bf-${arm}-${j.id}`);
      bf.style.left=(50+Math.min(frac,0))+'%';
      bf.style.width=Math.abs(frac)+'%';
      document.getElementById(`bd-${arm}-${j.id}`).textContent=
        ok?(deg>=0?'+':'')+deg.toFixed(1)+'°':'—';
      document.getElementById(`bp-${arm}-${j.id}`).textContent=
        ok?String(pos):'—';
    });
  }

  return {update, zero, arm3D};
}

// ── Init both arms ────────────────────────────────────────
const arms = {
  left:  createArm('left'),
  right: createArm('right'),
};
// Start the touch game once both Three.js scenes exist.
if(typeof game!=='undefined'){
  game.init({
    left:  {scene: arms.left.arm3D.scene,  getEEPosition: arms.left.arm3D.getEEPosition},
    right: {scene: arms.right.arm3D.scene, getEEPosition: arms.right.arm3D.getEEPosition},
  });
}

// ── H key: zero both ──────────────────────────────────────
let isZeroed = true;
document.addEventListener('keydown', e => {
  if(e.key==='h'||e.key==='H'){
    arms.left.zero();
    arms.right.zero();
    isZeroed=true;
    const badge=document.getElementById('zero-badge');
    badge.style.display='';
    setTimeout(()=>{ badge.style.display='none'; }, 2000);
  }
});

// ── WebSocket client ──────────────────────────────────────
const WS_URL = 'ws://localhost:8765';
let ws, retryDelay=1000;
const logEl = document.getElementById('log');

function connect() {
  logEl.textContent='connecting to '+WS_URL+'…';
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{ retryDelay=1000; logEl.textContent='connected — '+new Date().toLocaleTimeString(); };
  ws.onmessage=e=>{
    try{
      const data=JSON.parse(e.data);
      if(data.left)  arms.left.update(data.left);
      if(data.right) arms.right.update(data.right);
    } catch(err){ logEl.textContent='parse error: '+err.message; }
  };
  ws.onclose=()=>{
    ['left','right'].forEach(arm=>{
      document.getElementById(`dot-${arm}`).className='dot err';
      document.getElementById(`status-${arm}`).textContent=arm+' · disconnected';
    });
    logEl.textContent='disconnected — retrying in '+(retryDelay/1000).toFixed(0)+'s';
    setTimeout(connect,retryDelay);
    retryDelay=Math.min(retryDelay*2,8000);
  };
  ws.onerror=()=>{ logEl.textContent='cannot reach ws://localhost:8765 — is feetech_gui.py running?'; };
}

connect();
</script>
